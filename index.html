<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>子黑闪耀米兰</title>
<style>
:root {
  --bg: #fff7fa;
  --paper: #fff;
  --ink: #201b1d;
  --muted: #9a8f94;
  --line: #f0e5e9;
  --pink: #ff6f9d;
  --pink2: #ff9fbd;
  --soft: #fff0f5;
  --shadow: 0 18px 50px rgba(94,50,67,.10);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 15% 5%,#ffe9f1 0,transparent 27%),
              linear-gradient(180deg,#fff9fb,#fff);
  color: var(--ink);
  font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
.app { max-width: 800px; margin: 0 auto; padding: 20px; }
.hero { text-align: center; padding: 20px 0; }
.logo { display: inline-block; padding: 6px 16px; border-radius: 999px; background: #fff; border: 1px solid #f4dce5; font-size: 12px; font-weight: bold; color: #df5d88; }
.hero h1 { margin: 12px 0 6px; font-size: 26px; }
.hero h1 span { color: var(--pink); }
.hero p { margin: 0; color: var(--muted); font-size: 13px; }
.panel { background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 20px; margin-top: 10px; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; position: relative; }
.vs { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); width: 36px; height: 36px; background: var(--pink); color: #fff; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; z-index: 5; }
.card { border-radius: 16px; border: 1px solid var(--line); background: #fff; overflow: hidden; text-align: center; }
.photo { aspect-ratio: 4/5; width: 100%; background: #fdf0f4; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.info { padding: 12px; }
.name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
.btn { width: 100%; margin-top: 8px; padding: 8px 0; border: none; border-radius: 999px; background: var(--soft); color: #df5d88; font-weight: bold; }
@media (max-width: 500px) { .match-grid { grid-template-columns: 1fr; } .vs { display: none; } }
</style>
</head>
<body>

<div class="app">
  <div class="hero">
    <div class="logo">TF101 SMILE</div>
    <h1>米兰向子黑俯首</span>？</h1>
    <p>点击选择最闪耀子黑</p>
  </div>

  <div class="panel">
    <div class="match-grid">
      <div class="vs">VS</div>
      <div class="card">
        <div class="photo">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="选手A">
        </div>
        <div class="info">
          <div class="name">选手 A</div>
          <button class="btn">为你投一票</button>
        </div>
      </div>
      <div class="card">
        <div class="photo">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80" alt="选手B">
        </div>
        <div class="info">
          <div class="name">选手 B</div>
          <button class="btn">为你投一票</button>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
